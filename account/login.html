<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1>Login</h1>
    <section>
        <div class="card">
            <form id="login-form">
                <div id="credentials-step">
                    <div class="form-group">
                        <label for="identifier">Username or Email</label>
                        <input type="text" id="identifier" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required autocomplete="current-password">
                    </div>
                </div>

                <div id="2fa-step" style="display: none;">
                    <div class="form-group">
                        <label for="twoFactorCode">Enter 6-Digit Email Code</label>
                        <input type="text" id="twoFactorCode" maxlength="6" placeholder="123456" autocomplete="one-time-code">
                    </div>
                </div>

                <p id="error-msg" style="color: red; margin-top: 10px;"></p>

                <button type="submit" id="submit-btn">Login</button>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/account/login.js"></script>

</body>
</html>
