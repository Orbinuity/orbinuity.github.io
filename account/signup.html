<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Signup</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1>Signup</h1>
    <section>
        <div class="card">
            <form id="signup-form">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="displayName">Display Name *</label>
                    <input type="text" id="displayName" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="age">Age (Optional)</label>
                    <input type="number" id="age" min="1" max="120">
                </div>

                <div class="form-group">
                    <label for="pronouns">Pronouns (Optional)</label>
                    <input type="text" id="pronouns" placeholder="e.g. he/him, they/them">
                </div>

                <div class="form-group">
                    <label for="country">Country (Optional)</label>
                    <input type="text" id="country" placeholder="e.g. NL, US">
                </div>

                <p id="error-msg" style="color: red; margin-top: 10px;"></p>

                <button type="submit">Create Account</button>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/account/signup.js"></script>

</body>
</html>
