<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Signup</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1>Signup</h1>
    <section>
        <div class="card">
            <form id="signup-form">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="displayName">Display Name *</label>
                    <input type="text" id="displayName" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth (Optional)</label>
                    <input type="date" id="dateOfBirth">
                </div>

                <div class="form-group">
                    <label for="country">Country (Optional)</label>
                    <input type="text" id="country" placeholder="e.g. Netherlands, United States">
                </div>

                <div class="form-group">
                    <label for="pronouns">Pronouns (Optional)</label>
                    <input type="text" id="pronouns" placeholder="e.g. he/him, they/them">
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                    <input type="checkbox" id="acceptedTerms" required style="width: auto;">
                    <label for="acceptedTerms" style="margin: 0; font-size: 0.9rem;">
                        I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a> *
                    </label>
                </div>

                <p id="error-msg" style="color: red; margin-top: 10px;"></p>

                <button type="submit">Create Account</button>

                <p style="margin-top: 15px; text-align: center;">
                    Already have an account? <a href="/account/login.html">Log in</a>
                </p>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/account/signup.js"></script>

</body>
</html>
