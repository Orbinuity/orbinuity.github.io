<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Account</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1 id="page-heading">My Account</h1>
    <section>
        <div class="card">
            <p id="error-msg" style="color: red;"></p>

            <div id="account-details">
                <p><strong>Username:</strong> <span id="info-username">Loading...</span></p>
                <p><strong>Display Name:</strong> <span id="info-display-name">Loading...</span></p>
                <p><strong>Age:</strong> <span id="info-age">Loading...</span></p>
                <p><strong>Pronouns:</strong> <span id="info-pronouns">Loading...</span></p>
                <p><strong>Country:</strong> <span id="info-country">Loading...</span></p>
                <p><strong>Member Since:</strong> <span id="info-created-at">Loading...</span></p>
            </div>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/account/index.js"></script>

</body>
</html>
