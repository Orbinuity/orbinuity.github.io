<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Reset Password</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1 id="reset-title">Reset Password</h1>
    <section>
        <div class="card">
            <!-- Form 1: Request Reset Link -->
            <form id="request-reset-form">
                <p style="color: var(--dark-text);">Enter your username or email address and we will send you a password reset link.</p>
                
                <div class="form-group">
                    <label for="reset-identifier">Username or Email</label>
                    <input type="text" id="reset-identifier" required>
                </div>

                <p id="request-msg" style="margin-top: 10px;"></p>

                <button type="submit">Send Reset Link</button>

                <p style="margin-top: 15px; text-align: center;">
                    Remember your password? <a href="/account/login.html">Log in</a>
                </p>
            </form>

            <!-- Form 2: Enter New Password (shown when clicking email link) -->
            <form id="submit-new-password-form" style="display: none;">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required minlength="6">
                </div>

                <p id="submit-msg" style="margin-top: 10px;"></p>

                <button type="submit">Update Password</button>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/account/reset-password.js"></script>

</body>
</html>
