<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Orbinuity home">
    <meta property="og:description" content="The small company that loves tech">
    <meta property="og:image" content="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png">
    <meta name="description" content="The small company that loves tech">
    <meta name="generator" content="Github">
    <meta name="author" content="Orbinuity">
    <meta name="keywords" content="Orbinuity, website, tech, software, hartware, company, home">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png" type="image/png">
    <title>Orbinuity - Orbinuity App</title>
    <style>
        :root {
            --bg: #121212;
            --bg-accent: #2b2b2b;
            --header: #1a1a1a;
            --text: #f0f0f0;
            --dark-text: #888;
            --accent: #429ae3;
            --card: #1f1f1f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--header);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            text-decoration: none;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: var(--text);
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .container {
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
        }

        section {
            margin-bottom: 4rem;
        }

        .card {
            background-color: var(--card);
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        footer {
            background-color: var(--header);
            padding: 1rem;
            text-align: center;
            color: var(--dark-text);
        }

        button {
            background-color: var(--accent);
            color: var(--text);
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.5rem;
            margin: 0.5rem 0;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(66, 154, 227, 0.08);
            display: block;
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        button:hover, button:focus {
            background-color: #3076b6;
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            outline: none;
        }

        @media (max-width: 600px) {
            nav {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            nav a {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="/home"><h1><img src="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png" alt="icon" style="width:24px; height:24px; vertical-align: middle; margin-right: 8px;">Orbinuity</h1></a>
    <nav>
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/projects">Projects</a>
    </nav>
</header>

<main class="container">
    <h1>Orbinuity App</h1>
    <section id="home">
        <h2>A app for the orbinuity company</h2>
        <div class="card">
            <label>Repo and Download</label>
            <button onclick="window.location.href = 'https://github.com/Orbinuity/OrbinuityApp';">Repo</button>
            <button onclick="window.location.href = 'https://github.com/Orbinuity/OrbinuityApp/releases';">Download</button>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 Orbinuity. All rights reserved.</p>
</footer>

<script>
</script>

</body>
</html>
