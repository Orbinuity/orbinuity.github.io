<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="You can find us at Patreon, Twitch, Reddit, YouTube and GitHub.">
    <link rel="canonical" href="https://orbinuity.nl/contact">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact",
        "description": "You can find us at Patreon, Twitch, Reddit, YouTube and GitHub.",
        "url": "https://orbinuity.nl/contact",
        "mainEntity": {
            "@type": "Organization",
            "name": "Orbinuity",
            "url": "https://orbinuity.nl/home",
            "logo": "https://data.orbinuity.nl/assets/logo.png",
            "contactPoint": {
                "@type": "ContactPoint",
                "email": "orbinuity@ratgers.nl",
                "contactType": "general inquiries"
            },
            "sameAs": [
                "https://www.patreon.com/Orbinuity",
                "https://www.twitch.tv/Orbinuity",
                "https://www.reddit.com/r/Orbinuity",
                "https://www.youtube.com/@Orbinuity",
                "https://github.com/Orbinuity"
            ]
        }
    }
    </script>

    <link rel="icon" href="https://data.orbinuity.nl/assets/logo.png" type="image/png">
    <title>Orbinuity - Contact</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
    <h1>Contact Us</h1>
    <section>
        <div class="card">
            <a href="mailto:orbinuity@ratgers.nl" class="no-underline"><button>E-mail</button></a>
            <a href="https://www.patreon.com/cw/Orbinuity" class="no-underline"><button>Patreon</button></a>
            <a href="https://www.twitch.tv/Orbinuity" class="no-underline"><button>Twitch</button></a>
            <a href="https://www.reddit.com/r/Orbinuity/" class="no-underline"><button>Reddit</button></a>
            <a href="https://www.youtube.com/@Orbinuity" class="no-underline"><button>YouTube</button></a>
            <a href="https://www.github.com/Orbinuity" class="no-underline"><button>GitHub</button></a>
        </div>
        <div class="card">
            <form onsubmit="sendEmail(event)">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Your name">
                
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Your message"></textarea>
                
                <button type="submit">Send</button>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/contact.js" data-mail="orbinuity@ratgers.nl" data-sub="&(name) has a question!" data-prt="Hello, Orbinuity&#10;&#10;&(body)&#10;&#10;With kind regards,&#10;&(name)" data-ms="Thanks for contacting us, &(name). Your mail app will open now!"></script>

</body>
</html>
