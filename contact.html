<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Orbinuity contact">
    <meta property="og:description" content="Contact Orbinuity company">
    <meta property="og:image" content="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png">
    <meta name="description" content="Contact Orbinuity company">
    <meta name="generator" content="Github">
    <meta name="author" content="Orbinuity">
    <meta name="keywords" content="Orbinuity, website, tech, software, hartware, company, contact">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png" type="image/png">
    <title>Orbinuity - Contact</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header" data-id="/contact"></div>

<main class="container">
    <h1>Contact Us</h1>
    <section id="contact">
        <div class="card">
            <p>email: <a href="mailto:orbinuity@ratgers.nl">orbinuity@ratgers.nl</a></p>
        </div>
        <div class="card">
            <form onsubmit="sendEmail(event)">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Your name">
                
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Your message"></textarea>
                
                <button type="submit">Send</button>
            </form>
        </div>
    </section>
</main>

<div id="footer"></div>

<script src="/script.js"></script>
<script src="/contact.js" data-mail="orbinuity@ratgers.nl" data-sub="&(name) has a question!" data-prt="Hello, Orbinuity&#10;&#10;&(body)&#10;&#10;With kind regards,&#10;&(name)" data-ms="Thanks for contacting us, &(name). Your mail app will open now!"></script>

</body>
</html>
