<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Orbinuity contact">
    <meta property="og:description" content="Contact Orbinuity company">
    <meta property="og:image" content="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png">
    <meta name="description" content="Contact Orbinuity company">
    <meta name="generator" content="Github">
    <meta name="author" content="Orbinuity">
    <meta name="keywords" content="Orbinuity, website, tech, software, hartware, company, contact">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png" type="image/png">
    <title>Orbinuity - Contact</title>
    <style>
        :root {
            --bg: #121212;
            --bg-accent: #2b2b2b;
            --header: #1a1a1a;
            --text: #f0f0f0;
            --dark-text: #888;
            --accent: #429ae3;
            --card: #1f1f1f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--header);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            text-decoration: none;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: var(--text);
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .container {
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
        }

        section {
            margin-bottom: 4rem;
        }

        .card {
            background-color: var(--card);
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        #contact form {
            display: flex;
            flex-direction: column;
        }

        #contact input, #contact textarea {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 5px;
            background: var(--bg-accent);
            color: var(--text);
        }

        #contact button {
            background-color: var(--bg-accent);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        #contact button:hover {
            background-color: var(--accent);
        }

        footer {
            background-color: var(--header);
            padding: 1rem;
            text-align: center;
            color: var(--dark-text);
        }

        @media (max-width: 600px) {
            nav {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            nav a {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="/home"><h1><img src="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png" alt="icon" style="width:24px; height:24px; vertical-align: middle; margin-right: 8px;">Orbinuity</h1></a>
    <nav>
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact" style="text-decoration: underline;">Contact</a>
    </nav>
</header>

<main class="container">
    <h1>Contact Us</h1>
    <section id="contact">
        <div class="card">
            <p>email: orbinuity@ratgers.nl</p>
        </div>
        <div class="card">
            <form onsubmit="sendEmail(event)">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Your name">
                
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Your message"></textarea>
                
                <button type="submit">Send</button>
            </form>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 Orbinuity. All rights reserved.</p>
</footer>

<script>
    function sendEmail(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!name || !message) {
            alert("Please fill in both fields.");
            return;
        }

        alert("Thank you for messaging me, " + name + "! Your email app will now open.");
        
        const subject = encodeURIComponent(`${name} has a question!`);
        const body = encodeURIComponent(message);
        const mailto = `mailto:flora@ratgers-online.nl?subject=${subject}&body=${body}`;
        
        window.location.href = mailto;
    }
</script>

</body>
</html>
