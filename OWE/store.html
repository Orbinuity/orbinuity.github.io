<head>

    <meta property="og:description" content="The small company that loves tech">
    <meta property="og:image" content="https://raw.githubusercontent.com/Orbinuity/.github/main/assets/logo.png">
    <meta name="description" content="The small company that loves tech">
    <meta name="generator" content="Github">
    <meta name="author" content="Orbinuity">
    <meta name="keywords" content="Orbinuity, website, tech, software, hartware, company, home, OWE">

<body>

<header>
    <a href="/OWE"><h1><img src="https://raw.githubusercontent.com/Orbinuity/OWE/main/icons/OWE48.png" alt="icon" style="width:24px; height:24px; vertical-align: middle; margin-right: 8px;">OWE</h1></a>
    <nav>
        <a href="/home">Back to Orbinuity</a>
        <a href="/OWE">Home</a>
        <a href="/OWE/store" style="text-decoration: underline;">Store</a>
        <a href="/OWE/browser">Browser</a>
    </nav>
</header>

<main class="container">
    <h1>OWE extension store</h1>
    <section id="home">
        <h2>Popular extensions</h2>
        <div class="card">
            <button onclick="toggleExtension('test')" id="ext-test">Test Extension</button>
            <button onclick="toggleExtension('duck')" id="ext-duck">Duck Extension</button>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 Orbinuity. All rights reserved.</p>
</footer>

<script>
    function getCookie(name) {
        const cookies = document.cookie.split("; ");
        for (const cookie of cookies) {
            const [key, value] = cookie.split("=");
            if (key === name) return decodeURIComponent(value);
        }
        return null;
    }

    function setCookie(name, value, years = 10) {
        const date = new Date();
        date.setFullYear(date.getFullYear() + years);
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
    }

    function getExtensions() {
        const cookie = getCookie("proj.OWE.Extension");
        if (!cookie) return [];
        try {
            const parsed = JSON.parse(cookie);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function saveExtensions(list) {
        setCookie("proj.OWE.Extension", JSON.stringify(list));
    }

    function toggleExtension(name) {
        const list = getExtensions();
        const index = list.indexOf(name);

        if (index === -1) {
            list.push(name);
            alert(`Added ${name} extension!`);
        } else {
            list.splice(index, 1);
            alert(`Removed ${name} extension!`);
        }

        saveExtensions(list);
        updateButtons();
    }

    function updateButtons() {
        const active = getExtensions();
        document.querySelectorAll("button[id^='ext-']").forEach(btn => {
            const extName = btn.id.replace("ext-", "");
            btn.classList.toggle("active", active.includes(extName));
        });
    }

    updateButtons();
</script>

</body>
</html>
